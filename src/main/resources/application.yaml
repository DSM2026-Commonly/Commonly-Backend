spring:
  application:
    name: Commonly-be

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    commonly.commonlybe: ${LOG_LEVEL_APP:INFO}

jwt:
  secret: ${JWT_SECRET}
  header: ${JWT_HEADER:Authorization}
  prefix: ${JWT_PREFIX:Bearer}
  access-exp: ${JWT_ACCESS_EXP:3600}

garage:
  endpoint: ${GARAGE_ENDPOINT:http://garage:3900}
  region: ${GARAGE_REGION:garage}
  bucket: ${GARAGE_BUCKET:commonly}
  access-key: ${GARAGE_ACCESS_KEY:}
  secret-key: ${GARAGE_SECRET_KEY:}
