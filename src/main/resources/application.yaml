spring:
  application:
    name: Commonly-be

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:commonly}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch_size: 100

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  s3:
    bucket: ${S3_BUCKET:commonly-files}
    region: ${AWS_REGION:ap-northeast-2}
    endpoint: ${S3_ENDPOINT:}
  file:
    max-rows: 10000
