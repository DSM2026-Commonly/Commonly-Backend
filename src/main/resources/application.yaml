spring:
  application:
    name: Commonly-be

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        jdbc:
          batch_size: 100

  security:
    user:
      name: ${SECURITY_USER:admin}
      password: ${SECURITY_PASSWORD}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    commonly.commonlybe: ${LOG_LEVEL_APP:INFO}

app:
  s3:
    bucket: ${S3_BUCKET:commonly-files}
    region: ${AWS_REGION:ap-northeast-2}
    endpoint: ${S3_ENDPOINT:}
  file:
    max-rows: 10000

